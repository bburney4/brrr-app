input,select,button{font-family:inherit}
.mx{max-width:1200px;margin:0 auto}

.btn-d{background:#292524;color:#fff}.btn-l{background:#e7e5e4;color:#57534e}

table{width:100%;border-collapse:collapse}th{text-align:left;padding:5px 3px;font-size:9px;font-weight:700;color:#78716c;text-transform:uppercase;border-bottom:2px solid #e7e5e4}td{padding:5px 3px;border-bottom:1px solid #f5f5f4;font-size:11px}
