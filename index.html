<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BRRR">
<meta name="theme-color" content="#292524">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<title>BRRR Deal Analyzer — Hananiah Property Group</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans','Helvetica Neue',sans-serif;background:linear-gradient(145deg,#fafaf9 0%,#f5f0eb 50%,#fafaf9 100%);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
input,select,button{font-family:inherit}
.container{max-width:1200px;margin:0 auto}
.grid{display:grid;gap:16px}
.grid-main{grid-template-columns:1fr}
@media(min-width:1024px){.grid-main{grid-template-columns:1fr 2fr}}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e7e5e4;padding:20px}
.input{width:100%;padding:10px 12px;border-radius:8px;border:2px solid #d6d3d1;background:#fff;color:#1c1917;font-family:'DM Mono',monospace;font-size:14px;outline:none;transition:border-color .2s}
.input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
select.input{font-family:'DM Sans',sans-serif}
.label{display:block;font-size:11px;font-weight:700;color:#78716c;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.btn{padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;border:none;cursor:pointer;transition:all .2s}
.btn-dark{background:#292524;color:#fff}.btn-dark:hover{background:#44403c}
.btn-light{background:#e7e5e4;color:#57534e}.btn-light:hover{background:#d6d3d1}
.btn-indigo{background:#eef2ff;color:#4f46e5;padding:4px 10px;font-size:11px;border-radius:6px}
.btn-indigo:hover{background:#e0e7ff}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge-core{background:#d1fae5;color:#065f46}
.badge-emerging{background:#fef3c7;color:#92400e}
.badge-watch{background:#fee2e2;color:#991b1b}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-radius:8px}
.row-highlight{background:#fafaf9}
.mono{font-family:'DM Mono',monospace}
.text-green{color:#059669}.text-red{color:#dc2626}.text-amber{color:#d97706}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 6px;font-size:10px;font-weight:700;color:#78716c;text-transform:uppercase;border-bottom:2px solid #e7e5e4}
td{padding:8px 6px;border-bottom:1px solid #f5f5f4;font-size:12px}
tr:hover{background:#fafaf9}
.warning-box{padding:8px 12px;background:#fef3c7;border-radius:8px;font-size:12px;color:#92400e;margin-top:8px}
.note-box{padding:8px 12px;background:#fafaf9;border-radius:8px;font-size:12px;color:#57534e;margin-top:4px}
.dollar-input{position:relative}.dollar-input span{position:absolute;left:12px;top:10px;color:#a8a29e;font-size:14px}
.dollar-input input{padding-left:24px}
.divider{border-top:1px solid #e7e5e4;margin:8px 0}
@media(max-width:768px){body{padding:8px}.card{padding:16px;border-radius:12px}th,td{padding:6px 4px;font-size:10px}}
</style>
</head>

<script type="text/babel">
const {useState,useEffect,useCallback} = React;

const ZIP_DATA = {
  "35211":{zone:5,tier:"core",neighborhood:"West Birmingham / Ensley",trajectory:"Stable",icon:"➖",arvRange:"$80K–$130K",rent1:1144,rent2:1265,rent3:1584,rent4:1804,risk:"Wholesaler ARV inflation common — verify independently",flood:"Portions in AE flood zone",notes:"Core BRRR zip. Established deal flow. Strong S8 demand.",median:102000},
  "35205":{zone:8,tier:"core",neighborhood:"Five Points / UAB / Southside",trajectory:"Strong",icon:"🔥",arvRange:"$120K–$200K+",rent1:1364,rent2:1496,rent3:1870,rent4:2123,risk:"Higher purchase prices — confirm deal clears 1.5x",flood:"Low",notes:"Highest S8 payment standard. UAB proximity reduces vacancy.",median:228000},
  "35218":{zone:2,tier:"core",neighborhood:"Ensley / Titusville Adjacent",trajectory:"Caution",icon:"⚠️",arvRange:"$65K–$105K",rent1:1034,rent2:1133,rent3:1419,rent4:1617,risk:"Lowest payment zone. $165/mo less than Zone 5.",flood:"Verify per parcel",notes:"Tighter math. Only viable at significant acquisition discount.",median:72000},
  "35206":{zone:5,tier:"core",neighborhood:"East Lake / South East Lake",trajectory:"Improving",icon:"📈",arvRange:"$85K–$140K",rent1:1144,rent2:1265,rent3:1584,rent4:1804,risk:"Rapid comp movement — use 90-day comps only",flood:"Lower risk",notes:"Preferred zip. East Lake revitalization. Stronger trajectory than 35211.",median:103000},
  "35212":{zone:1,tier:"emerging",neighborhood:"Woodlawn / Crestwood",trajectory:"Strong",icon:"🔥",arvRange:"$90K–$150K",rent1:1023,rent2:1122,rent3:1408,rent4:1573,risk:"Zone 1 = lowest S8 rents. Gentrification inflating ARVs.",flood:"Low",notes:"STRONGEST gentrification signal. Woodlawn Entertainment District. Get in early.",median:110000},
  "35208":{zone:3,tier:"emerging",neighborhood:"Ensley / Bush Hills / Wylam",trajectory:"Early Stage",icon:"🌱",arvRange:"$60K–$100K",rent1:1078,rent2:1177,rent3:1474,rent4:1672,risk:"Block-level risk varies. Some blocks strong, others distressed.",flood:"Verify per parcel",notes:"CrossPlex Village catalyst. Cheap entry. Higher S8 than 35218.",median:80000},
  "35215":{zone:6,tier:"emerging",neighborhood:"Center Point / Roebuck",trajectory:"Stable",icon:"➖",arvRange:"$100K–$160K",rent1:1265,rent2:1386,rent3:1738,rent4:1969,risk:"Suburban feel — verify S8 demand compatibility.",flood:"Low",notes:"Zone 6 = $154/mo MORE than Zone 5. Suburban stability, lower crime.",median:150000},
  "35210":{zone:5,tier:"emerging",neighborhood:"Irondale / Crestline Heights",trajectory:"Improving",icon:"📈",arvRange:"$110K–$180K",rent1:1144,rent2:1265,rent3:1584,rent4:1804,risk:"Median $263K — target distressed pockets under $120K only.",flood:"Low",notes:"Same Zone 5 rents. Irondale has own police/fire. Cherry-pick only.",median:263000},
  "35222":{zone:5,tier:"watch",neighborhood:"Avondale / Lakeview",trajectory:"Strong",icon:"🔥",arvRange:"$180K–$400K+",rent1:1144,rent2:1265,rent3:1584,rent4:1804,risk:"Already gentrified. Median $372K. BRRR unlikely at current prices.",flood:"Low",notes:"WATCH ONLY. Prices have run. Only if severely distressed under $150K.",median:373000},
  "35204":{zone:1,tier:"watch",neighborhood:"Fountain Heights / West End",trajectory:"Early Stage",icon:"🌱",arvRange:"$45K–$85K",rent1:1023,rent2:1122,rent3:1408,rent4:1573,risk:"Highest vacancy. Zone 1 = lowest rents. Crime concerns.",flood:"Moderate",notes:"SPECULATIVE. Cheap entry but Zone 1 rents. Not for first BRRR.",median:59000},
  "35221":{zone:4,tier:"watch",neighborhood:"Midfield / McDonald Chapel",trajectory:"Stable",icon:"➖",arvRange:"$70K–$110K",rent1:1100,rent2:1210,rent3:1518,rent4:1727,risk:"Limited deal flow. Fewer comps = harder ARV verification.",flood:"Moderate",notes:"Zone 4 rents decent ($1,518 3BR). Low competition but limited exit.",median:95000},
};

const LENDER={purchaseRate:.12,rehabRate:.18,ltvCap:.75,origination:.05,contingency:10000,refiRate:.075,refiTerm:30};
const fmt=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n);
const pct=n=>(n*100).toFixed(2)+"%";

function getVerdict(r){
  if(r>=1.6)return{label:"✅ GO — STRONG",color:"#059669",bg:"#d1fae5",desc:"Full cash-out with buffer after hidden costs."};
  if(r>=1.5)return{label:"✅ GO — TARGET",color:"#059669",bg:"#d1fae5",desc:"Cash-out covers hidden costs. Solid BRRR."};
  if(r>=1.4)return{label:"⚠️ CONDITIONAL",color:"#d97706",bg:"#fef3c7",desc:"Paper positive but hidden costs likely eat it."};
  if(r>=1.33)return{label:"❌ BELOW FLOOR",color:"#dc2626",bg:"#fee2e2",desc:"Capital trapped at refi."};
  return{label:"⛔ DEAD",color:"#7f1d1d",bg:"#fecaca",desc:"Cash trapped. Walk away."};
}

function mp(principal,rate,years){const r=rate/12,n=years*12;if(r===0)return principal/n;return(principal*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1)}

function App(){
  const[inputs,setInputs]=useState({address:"",zip:"35211",sqft:"",bedrooms:"3",purchasePrice:"",rehabCost:"",arv:"",arvSource:"zillow",rehabBasis:"estimate",fears:false,propertyTax:"",insurance:"",refiRate:"7.5"});
  const[results,setResults]=useState(null);
  const[killers,setKillers]=useState([]);
  const[saved,setSaved]=useState(()=>{try{return JSON.parse(localStorage.getItem('brrr_saved'))||[]}catch{return[]}});
  const[tab,setTab]=useState("analyze");

  const zi=ZIP_DATA[inputs.zip]||null;
  const rent=useCallback(()=>{if(!zi)return 0;return zi[`rent${inputs.bedrooms}`]||0},[zi,inputs.bedrooms]);
  const up=(f,v)=>setInputs(p=>({...p,[f]:v}));

  const analyze=useCallback(()=>{
    const pp=parseFloat(inputs.purchasePrice)||0,rehab=parseFloat(inputs.rehabCost)||0,arv=parseFloat(inputs.arv)||0;
    const tax=parseFloat(inputs.propertyTax)||0,ins=parseFloat(inputs.insurance)||0;
    const rate=parseFloat(inputs.refiRate)/100||.075;
    if(!pp||!arv){setResults(null);return}
    const k=[];
    if(pp>arv*.75)k.push("Purchase price exceeds 75% of ARV before rehab");
    if(inputs.fears)k.push("ARV source is The Fears Organization — require independent verification");
    if(inputs.rehabBasis==="none")k.push("No contractor bid or estimate — rehab speculative");
    setKillers(k);
    const orig=pp*LENDER.origination,allIn=pp+rehab+LENDER.contingency+orig;
    const ratio=arv/allIn,maxRefi=arv*LENDER.ltvCap,cashOut=maxRefi-allIn;
    const mRent=rent(),aGross=mRent*12,vac=aGross*.05,noi=aGross-tax-ins-vac;
    const mDebt=mp(maxRefi,rate,LENDER.refiTerm),aDebt=mDebt*12,aCF=noi-aDebt,mCF=aCF/12;
    const cashLeft=cashOut<0?Math.abs(cashOut):0;
    const coc=cashLeft>0?aCF/cashLeft:aCF>0?Infinity:0;
    const capRate=arv>0?noi/arv:0,equity=arv-maxRefi;
    const refiClose=maxRefi*.025,hold=(pp*LENDER.purchaseRate/12)*3+(ins/12*3)+(tax/12*3),pmS=500;
    const totalHid=refiClose+hold+pmS,realCO=cashOut-totalHid;
    const v=getVerdict(ratio);
    const risks=[];
    if(inputs.arvSource==="wholesaler")risks.push("ARV from wholesaler — cross-reference comps");
    if(inputs.rehabBasis==="estimate")risks.push("Rehab estimate only — get contractor bid");
    if(zi&&(zi.trajectory==="Caution"||zi.trajectory==="Early Stage"))risks.push(inputs.zip+" — cautious trajectory");
    if(ratio>=1.5&&ratio<1.6)risks.push("Thin — 5% ARV miss drops below 1.50x");
    if(realCO<0)risks.push(fmt(Math.abs(realCO))+" trapped after hidden costs");
    if(cashOut>0&&realCO<0)risks.push("Paper positive but hidden costs make it negative");
    if(mCF<100)risks.push("Cash flow below $100/mo — thin for maintenance");
    setResults({pp,rehab,orig,allIn,arv,ratio,maxRefi,cashOut,mRent,aGross,vac,noi,tax,ins,mDebt,aDebt,aCF,mCF,coc,capRate,equity,v,risks,refiClose,hold,pmS,totalHid,realCO});
  },[inputs,rent,zi]);

  useEffect(()=>{analyze()},[analyze]);
  useEffect(()=>{try{localStorage.setItem('brrr_saved',JSON.stringify(saved))}catch{}},[saved]);

  const save=()=>{if(!results||!inputs.address)return;setSaved(p=>[...p,{addr:inputs.address,zip:inputs.zip,verdict:results.v.label,ratio:results.ratio.toFixed(2),co:results.realCO,cf:results.mCF,ts:new Date().toLocaleDateString()}])};

  const openComps=(zip)=>{window.open(`https://www.zillow.com/${zip}/sold/`,'_blank')};

  const tierColor=t=>t==="core"?"badge-core":t==="emerging"?"badge-emerging":"badge-watch";
  const trajColor=t=>t==="Strong"||t==="Improving"?"text-green":t==="Caution"||t==="Early Stage"?"text-amber":"";

  return React.createElement("div",{className:"container"},
    // Header
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:8}},
      React.createElement("div",null,
        React.createElement("h1",{style:{fontSize:24,fontWeight:700,color:"#1c1917",letterSpacing:"-.02em"}},"BRRR Deal Analyzer"),
        React.createElement("p",{style:{fontSize:12,color:"#78716c",marginTop:2}},"Hananiah Property Group LLC — Birmingham, AL")
      ),
      React.createElement("div",{style:{textAlign:"right"}},
        React.createElement("div",{style:{fontSize:10,color:"#a8a29e",textTransform:"uppercase",letterSpacing:".05em"}},"Minimum Ratio"),
        React.createElement("div",{className:"mono",style:{fontSize:22,fontWeight:700,color:"#d97706"}},"1.50x")
      )
    ),

    // Tab Buttons
    React.createElement("div",{style:{display:"flex",gap:8,marginBottom:16}},
      ["analyze","compare","saved"].map(t=>
        React.createElement("button",{key:t,className:"btn "+(tab===t?"btn-dark":"btn-light"),onClick:()=>setTab(t),style:{textTransform:"capitalize"}},t)
      )
    ),

    // ANALYZE TAB
    tab==="analyze"&&React.createElement("div",{className:"grid grid-main"},
      // Left col
      React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:16}},
        // Property Details
        React.createElement("div",{className:"card"},
          React.createElement("div",{className:"label",style:{marginBottom:12}},"① Property Details"),
          React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:10}},
            React.createElement("div",null,React.createElement("label",{className:"label"},"Address"),React.createElement("input",{className:"input",placeholder:"123 Main St, Birmingham",value:inputs.address,onChange:e=>up("address",e.target.value)})),
            React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
              React.createElement("div",null,React.createElement("label",{className:"label"},"Zip Code"),
                React.createElement("select",{className:"input",value:inputs.zip,onChange:e=>up("zip",e.target.value)},
                  React.createElement("optgroup",{label:"Core"},
                    React.createElement("option",{value:"35211"},"35211 Ensley"),
                    React.createElement("option",{value:"35205"},"35205 UAB"),
                    React.createElement("option",{value:"35206"},"35206 East Lake"),
                    React.createElement("option",{value:"35218"},"35218 Titusville")),
                  React.createElement("optgroup",{label:"Emerging"},
                    React.createElement("option",{value:"35212"},"35212 Woodlawn 🔥"),
                    React.createElement("option",{value:"35208"},"35208 Ensley 🌱"),
                    React.createElement("option",{value:"35215"},"35215 Center Pt"),
                    React.createElement("option",{value:"35210"},"35210 Irondale")),
                  React.createElement("optgroup",{label:"Watch"},
                    React.createElement("option",{value:"35222"},"35222 Avondale"),
                    React.createElement("option",{value:"35204"},"35204 Fountain Hts"),
                    React.createElement("option",{value:"35221"},"35221 Midfield"))
                )),
              React.createElement("div",null,React.createElement("label",{className:"label"},"Bedrooms"),
                React.createElement("select",{className:"input",value:inputs.bedrooms,onChange:e=>up("bedrooms",e.target.value)},
                  [1,2,3,4].map(n=>React.createElement("option",{key:n,value:n},n+" BR"))))
            ),
            React.createElement("div",null,React.createElement("label",{className:"label"},"Sq Ft"),React.createElement("input",{className:"input",type:"number",placeholder:"1,200",value:inputs.sqft,onChange:e=>up("sqft",e.target.value)}))
          )
        ),
        // Zip Intel
        zi&&React.createElement("div",{className:"card",style:{borderLeft:`4px solid ${zi.tier==="core"?"#059669":zi.tier==="emerging"?"#d97706":"#dc2626"}`}},
          React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
            React.createElement("span",{style:{fontWeight:700,fontSize:13,color:"#44403c"}},inputs.zip+" "+zi.icon),
            React.createElement("span",{className:"badge "+tierColor(zi.tier)},zi.tier)
          ),
          [["Zone",zi.zone],["Area",zi.neighborhood],["Trajectory",zi.trajectory,trajColor(zi.trajectory)],["Median",fmt(zi.median)],["ARV Range",zi.arvRange],["S8 "+inputs.bedrooms+"BR",fmt(rent())+"/mo","text-green"],["Flood",zi.flood]].map(([l,v,c],i)=>
            React.createElement("div",{key:i,style:{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:13}},
              React.createElement("span",{style:{color:"#78716c"}},l),
              React.createElement("span",{className:"mono "+(c||""),style:{fontWeight:600,fontSize:12}},v))
          ),
          React.createElement("div",{className:"warning-box"},React.createElement("b",null,"Risk: "),zi.risk),
          React.createElement("div",{className:"note-box"},zi.notes),
          React.createElement("button",{className:"btn btn-indigo",onClick:()=>openComps(inputs.zip),style:{width:"100%",marginTop:10,padding:"10px"}},"View Comps on Zillow →")
        ),
        // Deal Numbers
        React.createElement("div",{className:"card"},
          React.createElement("div",{className:"label",style:{marginBottom:12}},"② Deal Numbers"),
          React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:10}},
            [["Purchase Price","purchasePrice","65,000"],["Rehab Cost","rehabCost","35,000"],["ARV","arv","130,000"]].map(([l,k,ph])=>
              React.createElement("div",{key:k},React.createElement("label",{className:"label"},l),
                React.createElement("div",{className:"dollar-input"},React.createElement("span",null,"$"),
                  React.createElement("input",{className:"input",type:"number",placeholder:ph,value:inputs[k],onChange:e=>up(k,e.target.value)})))
            ),
            React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
              React.createElement("div",null,React.createElement("label",{className:"label"},"ARV Source"),
                React.createElement("select",{className:"input",value:inputs.arvSource,onChange:e=>up("arvSource",e.target.value)},
                  React.createElement("option",{value:"zillow"},"Zillow/Redfin"),React.createElement("option",{value:"mls"},"MLS"),React.createElement("option",{value:"wholesaler"},"Wholesaler"),React.createElement("option",{value:"other"},"Other"))),
              React.createElement("div",null,React.createElement("label",{className:"label"},"Rehab Basis"),

                  React.createElement("option",{value:"bid"},"Contractor Bid"),React.createElement("option",{value:"estimate"},"$/SqFt Est"),React.createElement("option",{value:"none"},"None")))

              React.createElement("input",{type:"checkbox",checked:inputs.fears,onChange:e=>up("fears",e.target.checked)}),"Fears Organization ARV"),

                React.createElement("div",{className:"dollar-input"},React.createElement("span",null,"$"),
                  React.createElement("input",{className:"input",type:"number",placeholder:"1,200",value:inputs.propertyTax,onChange:e=>up("propertyTax",e.target.value)}))),
              React.createElement("div",null,React.createElement("label",{className:"label"},"Annual Insurance"),
                React.createElement("div",{className:"dollar-input"},React.createElement("span",null,"$"),
                  React.createElement("input",{className:"input",type:"number",placeholder:"1,400",value:inputs.insurance,onChange:e=>up("insurance",e.target.value)})))
            ),
            React.createElement("div",null,React.createElement("label",{className:"label"},"Refi Rate %"),
              React.createElement("input",{className:"input",type:"number",step:.1,value:inputs.refiRate,onChange:e=>up("refiRate",e.target.value)}))
          )
        )
      ),
      // Right col
      React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:16}},
        // Deal Killers
        killers.length>0&&React.createElement("div",{style:{background:"#fef2f2",border:"2px solid #fca5a5",borderRadius:16,padding:20}},
          React.createElement("h2",{style:{fontSize:16,fontWeight:700,color:"#991b1b",marginBottom:10}},"⛔ DEAL KILLERS"),
          killers.map((k,i)=>React.createElement("div",{key:i,style:{display:"flex",gap:8,color:"#dc2626",fontSize:13,marginBottom:4}},React.createElement("span",null,"✕"),k)),

          React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}},
            React.createElement("div",null,
              React.createElement("div",{style:{fontSize:22,fontWeight:700,color:results.v.color}},results.v.label),
              React.createElement("p",{style:{fontSize:13,color:results.v.color+"cc",marginTop:4}},results.v.desc)),

              React.createElement("div",{style:{fontSize:10,color:"#78716c",textTransform:"uppercase"}},"ARV Ratio"),
              React.createElement("div",{className:"mono",style:{fontSize:32,fontWeight:700,color:results.v.color}},results.ratio.toFixed(2)+"x"),
              React.createElement("div",{style:{fontSize:10,color:"#78716c"}},"min: 1.50x | strong: 1.60x"))
          ),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginTop:16,paddingTop:12,borderTop:`1px solid ${results.v.color}30`}},
            React.createElement("div",null,React.createElement("div",{style:{fontSize:10,color:"#78716c",textTransform:"uppercase"}},"Real Cash-Out"),
              React.createElement("div",{className:"mono",style:{fontSize:18,fontWeight:700,color:results.realCO>=0?"#059669":"#dc2626"}},fmt(results.realCO)),
              React.createElement("div",{style:{fontSize:10,color:"#a8a29e"}},"after hidden costs")),
            React.createElement("div",null,React.createElement("div",{style:{fontSize:10,color:"#78716c",textTransform:"uppercase"}},"Monthly CF"),
              React.createElement("div",{className:"mono",style:{fontSize:18,fontWeight:700,color:results.mCF>=0?"#059669":"#dc2626"}},fmt(results.mCF))),
            React.createElement("div",null,React.createElement("div",{style:{fontSize:10,color:"#78716c",textTransform:"uppercase"}},"Cash-on-Cash"),
              React.createElement("div",{className:"mono",style:{fontSize:18,fontWeight:700,color:"#059669"}},results.coc===Infinity?"∞":pct(results.coc)))
          )
        ),
        // Pro Forma
        results&&React.createElement("div",{className:"card"},
          React.createElement("div",{className:"label",style:{marginBottom:12}},"Pro Forma"),
          [
            {l:"Purchase Price",v:fmt(results.pp)},{l:"Rehab Cost",v:fmt(results.rehab)},{l:"Contingency",v:fmt(10000)},{l:"Origination (5%)",v:fmt(results.orig)},
            {l:"ALL-IN COST",v:fmt(results.allIn),b:1,h:1},{d:1},
            {l:"ARV",v:fmt(results.arv)},{l:"ARV RATIO",v:results.ratio.toFixed(2)+"x",b:1,h:1,c:results.v.color},{d:1},
            {l:"Max Refi (75% ARV)",v:fmt(results.maxRefi)},{l:"Paper Cash-Out",v:fmt(results.cashOut),b:1,c:results.cashOut>=0?"#059669":"#dc2626"},
            {l:"Equity at Refi",v:fmt(results.equity)},{d:1},
            {l:"⚡ Refi Closing (2.5%)",v:"−"+fmt(results.refiClose)},{l:"⚡ Holding (3 mo)",v:"−"+fmt(results.hold)},{l:"⚡ PM Setup",v:"−$500"},
            {l:"TOTAL HIDDEN COSTS",v:"−"+fmt(results.totalHid),b:1},
            {l:"REAL CASH-OUT",v:fmt(results.realCO),b:1,h:1,c:results.realCO>=0?"#059669":"#dc2626"},{d:1},
            {l:`S8 ${inputs.bedrooms}BR Rent`,v:fmt(results.mRent)+"/mo"},{l:"Annual Gross",v:fmt(results.aGross)},{l:"Vacancy (5%)",v:"−"+fmt(results.vac)},
            {l:"Taxes",v:"−"+fmt(results.tax)},{l:"Insurance",v:"−"+fmt(results.ins)},{l:"NOI",v:fmt(results.noi),b:1},{d:1},
            {l:"Monthly Debt Service",v:fmt(results.mDebt)+"/mo"},{l:"MONTHLY CASH FLOW",v:fmt(results.mCF)+"/mo",b:1,h:1,c:results.mCF>=0?"#059669":"#dc2626"},{d:1},
            {l:"Cash-on-Cash",v:results.coc===Infinity?"∞":pct(results.coc),b:1},{l:"Cap Rate",v:pct(results.capRate)}
          ].map((r,i)=>{
            if(r.d)return React.createElement("div",{key:i,className:"divider"});
            return React.createElement("div",{key:i,className:"row"+(r.h?" row-highlight":"")},
              React.createElement("span",{style:{fontSize:13,fontWeight:r.b?700:400,color:r.b?"#1c1917":"#57534e"}},r.l),
              React.createElement("span",{className:"mono",style:{fontSize:13,fontWeight:r.b?700:400,color:r.c||(r.b?"#1c1917":"#57534e")}},r.v))
          })
        ),
        // Risks
        results&&results.risks.length>0&&React.createElement("div",{className:"card",style:{borderLeft:"4px solid #f59e0b"}},
          React.createElement("div",{className:"label",style:{color:"#92400e",marginBottom:8}},"Risk Flags"),
          results.risks.map((r,i)=>React.createElement("div",{key:i,style:{display:"flex",gap:8,fontSize:13,color:"#92400e",marginBottom:4}},React.createElement("span",null,"⚡"),r))
        ),
        // Action buttons
        results&&React.createElement("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
          React.createElement("button",{className:"btn btn-dark",onClick:save},"Save Deal"),
          React.createElement("button",{className:"btn btn-light",onClick:()=>{up("address","");up("purchasePrice","");up("rehabCost","");up("arv","");up("sqft","");up("propertyTax","");up("insurance","");setResults(null);setKillers([])}},"Clear"),
          React.createElement("button",{className:"btn btn-indigo",onClick:()=>openComps(inputs.zip),style:{padding:"10px 20px"}},"Zillow Comps →")
        ),
        // Empty state
        !results&&React.createElement("div",{style:{border:"2px dashed #d6d3d1",borderRadius:16,padding:48,textAlign:"center"}},
          React.createElement("div",{style:{fontSize:40,marginBottom:8}},"🏠"),
          React.createElement("h3",{style:{fontSize:16,fontWeight:700,color:"#44403c"}},"Enter Deal Numbers"),
          React.createElement("p",{style:{fontSize:13,color:"#78716c"}},"Fill in purchase price, rehab, and ARV."))
      )
    ),

    // COMPARE TAB
    tab==="compare"&&React.createElement("div",{className:"card"},
      React.createElement("div",{className:"label",style:{marginBottom:12}},"All Target Zip Codes — Sorted by S8 3BR Rent"),
      React.createElement("div",{style:{overflowX:"auto"}},
        React.createElement("table",null,
          React.createElement("thead",null,React.createElement("tr",null,
            ["Zip","Tier","Neighborhood","Zone","3BR S8","Median","ARV Range","",""].map((h,i)=>
              React.createElement("th",{key:i,style:i>=4?{textAlign:"right"}:{}},h)))),
          React.createElement("tbody",null,
            Object.entries(ZIP_DATA).sort((a,b)=>b[1].rent3-a[1].rent3).map(([z,d])=>
              React.createElement("tr",{key:z,onClick:()=>{up("zip",z);setTab("analyze")},style:{cursor:"pointer",background:inputs.zip===z?"#fefce8":""}},
                React.createElement("td",{className:"mono",style:{fontWeight:700}},z),
                React.createElement("td",null,React.createElement("span",{className:"badge "+tierColor(d.tier)},d.tier)),
                React.createElement("td",{style:{maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},d.neighborhood),
                React.createElement("td",{style:{textAlign:"center",fontWeight:700}},d.zone),
                React.createElement("td",{className:"mono text-green",style:{textAlign:"right",fontWeight:700}},fmt(d.rent3)),
                React.createElement("td",{className:"mono",style:{textAlign:"right"}},fmt(d.median)),
                React.createElement("td",null,d.arvRange),
                React.createElement("td",{style:{textAlign:"center"}},d.icon),
                React.createElement("td",null,React.createElement("button",{className:"btn btn-indigo",onClick:e=>{e.stopPropagation();openComps(z)}},"Comps"))
              )
            ))
        )
      ),
      React.createElement("p",{style:{marginTop:12,fontSize:11,color:"#a8a29e"}},"Tap any row to load into analyzer. Comps opens Zillow sold listings.")
    ),

    // SAVED TAB
    tab==="saved"&&React.createElement("div",{className:"card"},
      React.createElement("div",{className:"label",style:{marginBottom:12}},"Saved Deals ("+saved.length+")"),
      saved.length===0?React.createElement("p",{style:{fontSize:13,color:"#78716c",textAlign:"center",padding:32}},"No saved deals yet. Analyze a deal and tap Save."):
      React.createElement(React.Fragment,null,
        React.createElement("div",{style:{overflowX:"auto"}},
          React.createElement("table",null,
            React.createElement("thead",null,React.createElement("tr",null,
              ["Address","Zip","Verdict","Ratio","Cash-Out","Monthly CF","Date"].map((h,i)=>
                React.createElement("th",{key:i,style:i>=3?{textAlign:"right"}:{}},h)))),
            React.createElement("tbody",null,
              saved.map((d,i)=>React.createElement("tr",{key:i},
                React.createElement("td",{style:{fontWeight:500}},d.addr),
                React.createElement("td",null,d.zip),
                React.createElement("td",null,d.verdict),
                React.createElement("td",{className:"mono",style:{textAlign:"right",fontWeight:700}},d.ratio+"x"),
                React.createElement("td",{className:"mono",style:{textAlign:"right",color:d.co>=0?"#059669":"#dc2626"}},fmt(d.co)),
                React.createElement("td",{className:"mono",style:{textAlign:"right",color:d.cf>=0?"#059669":"#dc2626"}},fmt(d.cf)),
                React.createElement("td",{style:{fontSize:11,color:"#a8a29e"}},d.ts)
              ))
            )
          )
        ),
        React.createElement("button",{className:"btn btn-light",onClick:()=>setSaved([]),style:{marginTop:12}},"Clear All Saved")
      )
    )
  );
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
