function runCalc(pp,rh,av,tx,ins,L,br,zi,refiRate,rehabMo,seasoning,cont,vacPct,pmPct,maintPct,utilMo){

// Holding = rehab months + seasoning months
const totalHoldMo=rehabMo+seasoning;

const drw=L.drI?L.drI*3:0;

const postTax=zi?(av*zi.mill):tx;
